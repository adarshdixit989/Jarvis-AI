<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS AI — Voice Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<header>
  <div class="brand"><span class="orb"></span><div><b>JARVIS</b><small>PERSONAL AI ASSISTANT</small></div></div>
  <span class="status"><i></i><span id="statusText">READY</span></span>
</header>
<main>
  <section class="hero">
    <div class="core" id="core">
      <div class="ring r1"></div><div class="ring r2"></div><div class="core-dot"></div><div class="pulse"></div>
    </div>
    <h1>Good day, <span>Adarsh.</span></h1>
    <p id="subtitle">Your voice command center is ready.</p>
    <button id="mic" class="mic" type="button">
      <span class="mic-icon">🎙</span><span id="micLabel">TAP TO SPEAK</span>
    </button>
    <div class="voice-only">VOICE ONLY · NO TEXT TRANSCRIPT</div>
    <div id="voiceState" class="voice-state">READY</div>
  </section>
</main>
<footer>JARVIS AI · VOICE ASSISTANT</footer>
